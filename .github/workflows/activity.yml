name: Refresh activity card

on:
  # twice a day keeps the streak and heatmap current
  schedule:
    - cron: "0 */12 * * *"
  # allow running it manually from the Actions tab
  workflow_dispatch:
  # rebuild whenever the README or its generator changes
  push:
    branches:
      - main

jobs:
  activity:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # writes dist/activity-dark.svg and dist/activity-light.svg
      - name: Render activity card
        run: node scripts/activity.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # served from raw.githubusercontent.com/<user>/<repo>/output/…
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
